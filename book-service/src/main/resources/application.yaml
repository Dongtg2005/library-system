server:
  port: 8082 # Port riêng của Book Service

spring:
  application:
    name: book-service
  
  datasource:
    # Lấy biến môi trường DB_HOST, nếu không có thì mặc định là localhost
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/lms_book_db
    username: ${DB_USER:postgres}
    password: ${DB_PASS:V3ryS3cur3Passw0rd!} # Khớp với file .env đã setup
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Tự động tạo bảng dựa trên Entity (Chỉ dùng cho môi trường Dev)
      ddl-auto: update
    show-sql: true # In câu lệnh SQL ra console để dễ debug
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect