spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1
        - id: book-service
          uri: http://localhost:8084
          predicates:
            - Path=/books/**
          filters:
            - StripPrefix=1
        - id: borrow-service
          uri: http://localhost:8083
          predicates:
            - Path=/borrows/**
          filters:
            - StripPrefix=1

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
